<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOPH Official Trip Records System</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script defer src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script defer src="https://unpkg.com/html-docx-js/dist/html-docx.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/th.js"></script>
  <script defer src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>window.addEventListener('load', function(){ if(typeof pdfjsLib!=='undefined') pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js'; });</script>
  
  <style>
     html, body { height: 100%; }
     body { font-family: 'Prompt', sans-serif; background-color: #f0fdfa; margin: 0; }
     #app-container { display: flex; flex-direction: column; min-height: 100vh; }
     .status-badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
     .status-pending { background-color: #fef9c3; color: #a16207; }
     .status-approved { background-color: #dcfce7; color: #166534; }
     .status-returned { background-color: #fee2e2; color: #991b1b; }
     .kpi-box { background-color: white; padding: 1.5rem; border-radius: 0.75rem; text-align: left; box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);}
     .toggle-switch-label{position:relative;display:inline-flex;align-items:center;cursor:pointer}.toggle-switch-input{position:absolute;opacity:0;width:0;height:0}.toggle-switch-slider{width:44px;height:24px;background-color:#d1d5db;border-radius:9999px;transition:background-color .2s}.toggle-switch-slider::before{content:'';position:absolute;top:4px;left:4px;width:16px;height:16px;background-color:#fff;border-radius:9999px;transition:transform .2s}.toggle-switch-input:checked+.toggle-switch-slider{background-color:#10b981}.toggle-switch-input:checked+.toggle-switch-slider::before{transform:translateX(20px)}
    .calendar-day { cursor: pointer; position: relative; }
    .calendar-day:hover { background-color: #ecfdf5; }
    .hr-chart-card { overflow: hidden; }
    .hr-chart-card canvas { max-width: 100% !important; }
    @media print {
      body * { visibility: hidden; }
      #admin-print-area, #admin-print-area *, #dept-print-area, #dept-print-area *, #user-print-area, #user-print-area *, #leave-report-print-area, #leave-report-print-area *, #leave-office-report-print-area, #leave-office-report-print-area * { visibility: visible; }
      #admin-print-area, #dept-print-area, #user-print-area, #leave-report-print-area, #leave-office-report-print-area { position: absolute; left: 0; top: 0; width: 100%; background: white; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="antialiased">
  <div id="app-container"></div>
  <footer class="text-center text-xs text-gray-500 mt-8 py-4">
          <p>We work in the shadows, so the data can shine in the light.</p>
          <p class="font-semibold">Created by Batman (DHT4)</p>
          <p>Nakhon Nayok Provincial Public Health Office</p>
          <p>Contact: nophfda.app@gmail.com</p>
  </footer>
  <script src="/app.js"></script>
  <script src="/checkin.js"></script>
  <script src="/wfh.js"></script>
  <script src="/leaves.js"></script>
  <script src="/trips.js"></script>
  <script src="/batchsign.js"></script>
  <script src="/reports.js"></script>
  <script src="/settings.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
