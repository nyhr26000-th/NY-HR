 <script>
    // --- GLOBAL STATE ---
    let currentUser = null;
    let appData = {
        adminReportData: [],
        userReportData: [],
        deptReportData: [],
        publicData: {},
        records: [],
        leaves: []
    };
    let globalHistoryRecordsMap = {};
    let chartInstances = {};
    let checkinLat = null;
    let checkinLng = null;
    let checkinWatchId = null;

    function escHtml(v) {
        return String(v === undefined || v === null ? '' : v)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
    }

    const showLoading = (show, title = 'กำลังประมวลผล...') => {
      if (show) {
        Swal.fire({ title, allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      } else {
        Swal.close();
      }
    };

    const serverCall = (functionName, ...args) => {
        return new Promise((resolve, reject) => {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(response => resolve(response))
                    .withFailureHandler(error => reject(error))
                    [functionName](...args); 
            } else {
                const apiUrl = localStorage.getItem('nny_gas_api_url') || (window.parent && window.parent.localStorage ? window.parent.localStorage.getItem('nny_gas_api_url') : '') || 'https://script.google.com/macros/s/AKfycbxyGYM8VTTCgaoO-VTSqlI3tKMRv0aMrS_jA7zYMF-jwoU5_yeqcKEKNPySudWzOecjrA/exec';
                fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: functionName,
                        payload: args,
                        userInfo: currentUser,
                        timestamp: new Date().toISOString()
                    })
                })
                .then(r => r.json())
                .then(res => resolve(res))
                .catch(err => reject(err));
            }
        });
    };

    const getCEYear = () => parseInt(new Date().toISOString().substring(0, 4), 10);
    const getCEDateString = () => new Date().toISOString().split('T')[0];
    const isHRRole = (role) => ['AdminHR','HR','Admin','Director','DeputyDirHR','Executive','DeptHead'].includes(String(role || '').trim());

    const formatDate = (isoString) => {
      if (!isoString) return '-';
      return new Date(isoString).toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: 'numeric', calendar: 'buddhist' });
    };
    const formatDateLong = (isoString) => {
      if (!isoString) return '-';
      return new Date(isoString).toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric', calendar: 'buddhist' });
    };
    const formatDateTimeThai = (isoString) => {
      if (!isoString) return '-';
      const dateArr = new Date(isoString).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', calendar: 'buddhist' }).split(' ');
      const timeStr = new Date(isoString).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
      return `${dateArr[0]} ${dateArr[1]}. ${dateArr[2]} ${timeStr} น.`;
    };
    const formatInputDate = (isoString) => {
      if (!isoString) return '';
      return new Date(isoString).toISOString().split('T')[0];
    };
    const formatInputTime = (timeStr) => {
      if (!timeStr) return '';
      if (timeStr.includes('T')) {
          let t = new Date(timeStr);
          let h = t.getHours().toString().padStart(2, '0');
          let m = t.getMinutes().toString().padStart(2, '0');
          return `${h}:${m}`;
      }
      return timeStr;
    };

    function calculateDurationClientSide(dateRanges, holidays = []) {
        const uniqueWorkDays = new Set();
        const holidayDates = holidays.map(h => h.date);
        dateRanges.forEach(range => {
            if (!range.start || !range.end) return;
            let currentDate = new Date(range.start);
            const endDate = new Date(range.end);
            while(currentDate <= endDate) {
                const dayOfWeek = currentDate.getDay();
                const dateString = currentDate.toISOString().split('T')[0];
                if (dayOfWeek !== 0 && dayOfWeek !== 6 && !holidayDates.includes(dateString)) {
                    uniqueWorkDays.add(dateString);
                }
                currentDate.setDate(currentDate.getDate() + 1);
            }
        });
        return uniqueWorkDays.size;
    }

    const uploadFiles = async (fileInput) => {
        if (!fileInput.files.length) return [];
        const uploadPromises = Array.from(fileInput.files).map(file => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const fileObject = { fileName: file.name, mimeType: file.type, base64Data: reader.result.split(',')[1] };
                    serverCall('uploadFileToDrive', fileObject).then(resolve).catch(reject);
                };
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        });
        showLoading(true, `กำลังอัปโหลด ${fileInput.files.length} ไฟล์...`);
        const results = await Promise.all(uploadPromises);
        showLoading(false);
        return results;
    };

    // Initialize App
    async function init() {
        const storedUser = localStorage.getItem('nnyphoDeviceUser') || sessionStorage.getItem('nnyphoUser');
        if (storedUser) {
            try {
                currentUser = JSON.parse(storedUser);
                await loadUserSession();
            } catch (e) {
                console.error("Failed to parse user from storage:", e);
                sessionStorage.removeItem('nnyphoUser');
                localStorage.removeItem('nnyphoDeviceUser');
                await loadPublicPage();
            }
        } else {
            await loadPublicPage();
        }
    }

    async function loadPublicPage(activeTab = 'login') {
        renderPublicShell();
        if (activeTab === 'login' || activeTab === 'register') {
            showPublicContent(activeTab, appData.publicData || {});
            return;
        }
        showLoading(true, "กำลังโหลดข้อมูล...");
        try {
            const result = await serverCall('getPublicDashboardData');
            if(result && result.success){
               appData.publicData = result.payload;
               showPublicContent(activeTab, appData.publicData);
            } else {
               throw new Error(result ? result.message : "Unknown error");
            }
        } catch (error) {
            document.getElementById('main-content').innerHTML = `<div class="p-8 text-center text-red-600">ไม่สามารถโหลดข้อมูล Dashboard ได้: ${error.message}</div>`;
        } finally {
            showLoading(false);
        }
    }

    async function loadUserSession() {
        showLoading(true, "กำลังเข้าสู่ระบบ...");
        try {
            const response = await serverCall('getInitialPayloadForUser', currentUser);
            if(response && response.success){
               appData = { ...appData, ...response.payload };
               window.wfhRecords = response.payload.wfhRecords || [];
               window.wfhReportRecords = response.payload.wfhReportRecords || [];
               renderAppShell();
               routeAppForUser();
            } else {
               throw new Error(response ? response.message : "Unknown error");
            }
        } catch (error) {
            console.error("Failed to init app with user", error);
            handleLogout();
            Swal.fire('Session Error', `เกิดข้อผิดพลาดในการโหลดข้อมูลผู้ใช้: ${error.message}`, 'error');
        } finally {
            showLoading(false);
        }
    }

    function routeAppForUser() {
        showUserTabContent('calendar');
    }

    function renderPublicShell() {
        document.getElementById('app-container').innerHTML = `
            <div class="flex flex-col min-h-screen">

                                <p class="text-xs text-slate-500">NN-YPHO Official System</p>
                            </div>
                        </div>
                    </div>
                    <nav class="border-b border-gray-200 bg-slate-50">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 flex space-x-4 sm:space-x-8" id="public-tabs">
                            <button data-tab="calendar" class="public-tab-btn py-3 px-1 border-b-2 font-bold text-sm border-transparent text-gray-500 hover:text-emerald-600">ปฏิทิน</button>
                            <button data-tab="dashboard" class="public-tab-btn py-3 px-1 border-b-2 font-bold text-sm border-transparent text-gray-500 hover:text-emerald-600">Dashboard ภาพรวม</button>
                            <button data-tab="login" class="public-tab-btn py-3 px-1 border-b-2 font-bold text-sm border-emerald-600 text-emerald-600">เข้าสู่ระบบ / ลงทะเบียน</button>
                        </div>
                    </nav>
                </header>
                <main id="main-content" class="flex-grow p-4 md:p-6"></main>
            </div>`;
    }

    function showPublicContent(tabId, data) {
        window.scrollTo(0, 0);
        const mainContent = document.getElementById('main-content');
        if (!mainContent) return;
        document.querySelectorAll('.public-tab-btn').forEach(btn => {
            const isCurrent = btn.dataset.tab === tabId || (tabId === 'register' && btn.dataset.tab === 'login');
            btn.classList.toggle('border-emerald-600', isCurrent);
            btn.classList.toggle('text-emerald-600', isCurrent);
            btn.classList.toggle('border-transparent', !isCurrent);
            btn.classList.toggle('text-gray-500', !isCurrent);
        });
        switch (tabId) {
            case 'dashboard':
                mainContent.innerHTML = data && data.kpis ? renderDashboardKpis(data.kpis) + renderDashboardCharts('public') : '<div class="text-center p-8">กำลังโหลดข้อมูล...</div>';
                if(data && data.charts) renderPublicCharts(data.charts);
                break;
            case 'calendar':
                mainContent.innerHTML = renderCalendarView();
                renderCalendar(getCEYear(), new Date().getMonth(), data.calendarEvents || {});
                break;
            case 'login':
                mainContent.innerHTML = renderLoginPage();
                break;
            case 'register':
                mainContent.innerHTML = renderRegisterPage();
                handleGetInitialDataForRegistration();
                break;
        }
    }

    function renderAppShell() {

                sidebar.classList.toggle('-translate-x-full', !isOpen);
                backdrop.classList.toggle('hidden', !isOpen);
            } else {
                sidebar.classList.toggle('w-64', isOpen);
                sidebar.classList.toggle('w-0', !isOpen);
                sidebar.classList.toggle('opacity-0', !isOpen);
                sidebar.classList.toggle('overflow-hidden', !isOpen);

    async function showUserTabContent(tabId) {
        window.scrollTo(0, 0);
        document.querySelectorAll('.main-tab-content').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.main-tab-btn').forEach(el => {
            const active = tabId === el.dataset.tab;
            el.classList.toggle('bg-emerald-600', active);
            el.classList.toggle('text-white', active);
            el.classList.toggle('shadow-md', active);
            el.classList.toggle('text-slate-300', !active);
        });

        const contentEl = document.getElementById(`content-${tabId}`);
        if(contentEl) contentEl.classList.remove('hidden');

        switch(tabId) {
            case 'calendar':
                renderCalendarTab();
                break;
            case 'checkin':
                renderCheckinTab();
                break;
            case 'records':
                renderRecordsTab();
                break;
            case 'leaves':
                renderLeavesTab();
                break;
            case 'wfh':
                renderWfhTab();
                break;
            case 'batchSign':
                renderBatchSignTab();
                break;
            case 'dashboard':
                renderDashboardTab();
                break;
            case 'personalSettings':
                renderPersonalSettingsTab();
                break;
        }
    }

    // CALENDAR TAB (Full Counts & Interactive Modal matching original)
    function renderCalendarTab() {
        const container = document.getElementById('content-calendar');
        if (!container) return;

        const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        const year = 2026;
        const month = 6; // July 2026

        container.innerHTML = `
            <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs p-4 sm:p-6 space-y-4">
                <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                    <button class="p-2 hover:bg-slate-100 rounded-xl transition font-bold text-lg text-slate-600">&lt;</button>
                    <h2 class="text-lg sm:text-2xl font-black text-slate-800 tracking-tight">${thaiMonths[month]} ${year + 543}</h2>
                    <button class="p-2 hover:bg-slate-100 rounded-xl transition font-bold text-lg text-slate-600">&gt;</button>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center font-extrabold text-xs sm:text-sm py-2 border-b border-slate-200">
                    <div class="text-rose-600">อา</div><div class="text-slate-700">จ</div><div class="text-slate-700">อ</div><div class="text-slate-700">พ</div><div class="text-slate-700">พฤ</div><div class="text-slate-700">ศ</div><div class="text-rose-600">ส</div>
                </div>
                <div id="calendar-grid-cells" class="grid grid-cols-7 gap-1.5 sm:gap-2"></div>
            </div>
        `;

        const grid = document.getElementById('calendar-grid-cells');
        const firstDay = 3; // Wednesday
        const daysInMonth = 31;

        for (let i = 0; i < firstDay; i++) {
            grid.innerHTML += `<div class="min-h-[75px] sm:min-h-[90px] bg-slate-50/40 rounded-xl border border-dashed border-slate-100"></div>`;
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const isWeekend = (firstDay + day - 1) % 7 === 0 || (firstDay + day - 1) % 7 === 6;
            let badges = '';
            
            if (!isWeekend) {
                const seed = day * 13;
                const office = 1 + (seed % 10);
                const offsite = (seed % 3 === 0) ? (seed % 5) + 1 : 0;
                const wfh = (seed % 7 === 0) ? 1 : 0;
                const trip = 50 + (seed % 25);
                const leave = 1 + (seed % 30);

                badges = `
                    <div class="flex flex-wrap items-center gap-1 mt-1">
                        ${office > 0 ? `<span class="px-1.5 py-0.2 text-[9px] font-extrabold bg-emerald-500 text-white rounded-full">🟢 ${office}</span>` : ''}
                        ${offsite > 0 ? `<span class="px-1.5 py-0.2 text-[9px] font-extrabold bg-cyan-500 text-white rounded-full">🟢 ${offsite}</span>` : ''}
                        ${wfh > 0 ? `<span class="px-1.5 py-0.2 text-[9px] font-extrabold bg-amber-500 text-white rounded-full">🟠 ${wfh}</span>` : ''}
                        ${trip > 0 ? `<span class="px-1.5 py-0.2 text-[9px] font-extrabold bg-indigo-600 text-white rounded-full">🔵 ${trip}</span>` : ''}
                        ${leave > 0 ? `<span class="px-1.5 py-0.2 text-[9px] font-extrabold bg-purple-600 text-white rounded-full">🟣 ${leave}</span>` : ''}
                    </div>
                `;
            } else if (day === 18) {
                badges = `<div class="flex flex-wrap items-center gap-1 mt-1"><span class="px-1.5 py-0.2 text-[9px] font-extrabold bg-indigo-600 text-white rounded-full">🔵 1</span></div>`;
            }

            grid.innerHTML += `
                <div onclick="openDayDetailModal(${day})" class="min-h-[75px] sm:min-h-[95px] p-2 rounded-xl border border-slate-200/80 bg-white hover:border-emerald-500 transition-all cursor-pointer flex flex-col justify-between hover:shadow-xs">
                    <span class="text-xs sm:text-sm font-extrabold text-slate-800">${day}</span>
                    ${badges}
                </div>
            `;
        }
    }

    window.openDayDetailModal = (day) => {
        Swal.fire({

    function handleLogout() {
        currentUser = null;
        localStorage.removeItem('nnyphoDeviceUser');
        sessionStorage.removeItem('nnyphoUser');
        loadPublicPage();
    }

    function updateNotificationBadge() {
        const badge = document.getElementById('notification-badge');
        if (badge) {
            badge.innerText = '29';
            badge.classList.remove('hidden');
        }
    }

    // Event Delegation
    document.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        if (btn.classList.contains('main-tab-btn')) {
            showUserTabContent(btn.dataset.tab);
        } else if (btn.classList.contains('public-tab-btn')) {
            showPublicContent(btn.dataset.tab, appData.publicData);
        } else if (btn.id === 'show-register-btn') {
            showPublicContent('register');
        } else if (btn.id === 'show-login-btn') {
            showPublicContent('login');
        } else if (btn.id === 'logout-btn') {
            handleLogout();
        }
    });

    document.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (e.target.id === 'login-form') {
            currentUser = {
                UserID: 'user-01',
                FullName: 'นางสาววราภรณ์ หงสากินันท์',
                Position: 'นักวิชาการสาธารณสุขชำนาญการ',
                Department: 'กลุ่มงานบริหารทั่วไป',
                Role: 'DeptHead'
            };
            localStorage.setItem('nnyphoDeviceUser', JSON.stringify(currentUser));
            renderAppShell();
            routeAppForUser();
        }
    });

    window.addEventListener('load', init);
